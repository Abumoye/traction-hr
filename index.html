  <!-- Rich text for search engines (Google): describes the product as a web application -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Traction Outsourcing HRMS",
    "url": "https://hr.tolnigeria.com/",
    "applicationCategory": "BusinessApplication",
    "applicationSubCategory": "Human resource management",
    "operatingSystem": "Web",
    "description": "HRIS + Payroll + ATS + Employee Self-Service web application for Nigerian business.",
    "featureList": ["HRIS", "Payroll", "Applicant tracking system (ATS)", "Employee Self-Service"],
    "image": "https://hr.tolnigeria.com/assets/img/og/traction-hrms-og.png?v=1",
    "inLanguage": "en-NG",
    "audience": { "@type": "BusinessAudience", "geographicArea": { "@type": "Country", "name": "Nigeria" } },

<body>
  <main class="auth">
    <section class="auth-brand">
      <div class="logo-card"><img src="assets/img/traction-logo.png" alt="Traction Outsourcing"></div>
      <div>
        <h2>People, payroll and hiring in <span class="accent">one place</span>.</h2>
        <p>Manage employees, leave, Nigerian payroll and recruitment for your company.</p>
      </div>
      <p>&copy; Traction Outsourcing Limited</p>
    </section>

    <section class="auth-form-wrap">
      <div class="auth-card">
        <h1>Sign in</h1>
        <p class="hint">Use the company code your administrator gave you.</p>

        <div id="message" hidden></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="companyCode">Company code</label>
            <input id="companyCode" name="companyCode" autocomplete="organization" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button id="login-btn" class="btn btn-block" type="submit">Sign in</button>
        </form>

        <div class="auth-foot">
          <a href="signup.html">Create a company</a>
          <button id="test-connection" class="btn btn-ghost" type="button">Test connection</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
